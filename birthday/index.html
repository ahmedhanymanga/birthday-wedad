<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6f91;
    --deep:#d6336c;
    --text:#4a2c3a;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,#fff5f8 0%,#ffe3ee 45%,#ffd9e8 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }

  body.locked{overflow:hidden;}

  #petals{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }

  #lockScreen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    transition:opacity .8s ease, visibility .8s ease;
  }
  #lockScreen.hide{opacity:0;visibility:hidden;pointer-events:none;}

  .lock-card{
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px;
    padding:46px 32px;
    width:min(420px,100%);
    text-align:center;
    box-shadow:0 24px 60px rgba(214,51,108,.18);
    animation:pop .8s cubic-bezier(.2,.9,.3,1.35);
  }
  @keyframes pop{
    0%{opacity:0;transform:scale(.85) translateY(20px);}
    100%{opacity:1;transform:scale(1) translateY(0);}
  }

  .lock-icon{font-size:44px;margin-bottom:10px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  .lock-card h1{
    font-family:'Great Vibes',cursive;
    font-size:38px;
    color:var(--deep);
    font-weight:400;
    margin-bottom:6px;
  }
  .lock-card p{font-size:14px;color:#8a6273;font-weight:300;margin-bottom:24px;}

  #pwInput{
    width:100%;
    padding:14px 18px;
    border-radius:50px;
    border:2px solid #ffd0e0;
    background:#fff;
    font-family:inherit;
    font-size:16px;
    color:var(--text);
    text-align:center;
    outline:none;
    transition:border-color .3s, box-shadow .3s;
    letter-spacing:2px;
  }
  #pwInput:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,111,145,.15);}

  #pwBtn{
    margin-top:16px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg,#ff8fab,#d6336c);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(214,51,108,.32);
    transition:transform .25s, box-shadow .25s;
  }
  #pwBtn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(214,51,108,.42);}
  #pwBtn:active{transform:translateY(0) scale(.98);}

  #errorMsg{
    margin-top:14px;
    font-size:13px;
    color:#e0356e;
    min-height:18px;
    font-weight:400;
  }

  .shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{
    10%,90%{transform:translateX(-4px);}
    20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-9px);}
    40%,60%{transform:translateX(9px);}
  }

  #mainContent{
    position:relative;
    z-index:1;
    opacity:0;
    transition:opacity 1.1s ease .25s;
  }
  #mainContent.hidden{display:none;}
  #mainContent.show{opacity:1;}

  section{padding:70px 22px;}

  .wrap{max-width:980px;margin:0 auto;}

  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 22px;
  }
  .hero h1{
    font-family:'Great Vibes',cursive;
    font-weight:400;
    font-size:clamp(52px,13vw,110px);
    line-height:1.05;
    background:linear-gradient(135deg,#ff8fab,#d6336c,#a61e4d);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    padding:0 10px;
  }
  .hero .sub{
    margin-top:14px;
    font-size:clamp(15px,3.6vw,19px);
    font-weight:300;
    color:#8a6273;
    letter-spacing:3px;
    text-transform:uppercase;
  }
  .scroll-hint{
    margin-top:52px;
    font-size:13px;
    color:#b98ba0;
    letter-spacing:1px;
    animation:bob 2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.7;}50%{transform:translateY(8px);opacity:1;}}

  /* ---------- BIG BLOOMING WHITE FLOWER ---------- */
  .flower-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:6px;
  }
  .big-flower{
    width:min(300px,68vw);
    height:auto;
    overflow:visible;
    filter:drop-shadow(0 18px 38px rgba(214,51,108,.22));
    animation:flowerSway 6s ease-in-out infinite;
  }
  @keyframes flowerSway{
    0%,100%{transform:rotate(-3deg) translateY(0);}
    50%{transform:rotate(3deg) translateY(-10px);}
  }
  .big-flower .petal{
    transform-box:view-box;
    transform-origin:50% 50%;
    transform:scale(0);
    animation:petalBloom 1s cubic-bezier(.2,.9,.3,1.35) forwards;
  }
  @keyframes petalBloom{
    0%{transform:scale(0) rotate(-75deg);opacity:0;}
    60%{opacity:1;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }
  .big-flower .d1{animation-delay:.05s;}
  .big-flower .d2{animation-delay:.12s;}
  .big-flower .d3{animation-delay:.19s;}
  .big-flower .d4{animation-delay:.26s;}
  .big-flower .d5{animation-delay:.33s;}
  .big-flower .d6{animation-delay:.40s;}
  .big-flower .d7{animation-delay:.47s;}
  .big-flower .d8{animation-delay:.54s;}
  .big-flower .core{
    transform-box:view-box;
    transform-origin:50% 50%;
    transform:scale(0);
    animation:petalBloom .8s cubic-bezier(.2,.9,.3,1.45) .78s forwards;
  }

  .card{
    background:rgba(255,255,255,.68);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:26px;
    padding:40px 30px;
    box-shadow:0 18px 46px rgba(214,51,108,.10);
  }

  .section-title{
    font-family:'Great Vibes',cursive;
    font-weight:400;
    font-size:clamp(34px,7vw,50px);
    color:var(--deep);
    text-align:center;
    margin-bottom:28px;
  }

  #messageText{
    font-size:clamp(15px,3.6vw,17px);
    line-height:2;
    font-weight:300;
    color:#5b3a49;
    white-space:pre-line;
    text-align:center;
    max-width:680px;
    margin:0 auto;
  }
  .signature{
    margin-top:30px;
    text-align:center;
    font-family:'Great Vibes',cursive;
    font-size:30px;
    color:var(--pink);
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:14px;
  }
  .gallery-grid img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:18px;
    cursor:pointer;
    display:block;
    box-shadow:0 8px 22px rgba(214,51,108,.13);
    transition:transform .4s cubic-bezier(.2,.9,.3,1.2), box-shadow .4s;
    background:#ffe9f1;
  }
  .gallery-grid img:hover{
    transform:translateY(-6px) scale(1.035);
    box-shadow:0 18px 38px rgba(214,51,108,.28);
  }

  .video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
  }
  .video-grid video{
    width:100%;
    border-radius:18px;
    display:block;
    background:#000;
    box-shadow:0 10px 26px rgba(214,51,108,.16);
  }

  .finale{
    text-align:center;
    padding-bottom:110px;
  }
  .finale .big{
    font-family:'Great Vibes',cursive;
    font-size:clamp(38px,9vw,64px);
    color:var(--deep);
    line-height:1.3;
  }
  .finale .hearts{font-size:26px;letter-spacing:8px;margin-top:18px;}

  .reveal{opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.9,.3,1);}
  .reveal.visible{opacity:1;transform:none;}

  #lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(40,12,24,.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    cursor:zoom-out;
  }
  #lightbox.open{display:flex;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  #lightbox img{
    max-width:100%;
    max-height:92vh;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:pop .4s cubic-bezier(.2,.9,.3,1.3);
  }

  .burst{
    position:fixed;
    z-index:60;
    pointer-events:none;
    animation:burst 2.3s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(.4);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(200deg);opacity:0;}
  }

  #musicBtn{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:40;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 24px rgba(214,51,108,.25);
    font-size:22px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    transition:transform .25s;
  }
  #musicBtn:hover{transform:scale(1.08);}
  #musicBtn.show{display:flex;}

  /* ---------- LITTLE GAME ---------- */
  .game-card{text-align:center;overflow:hidden;}
  .game-q{
    font-size:clamp(16px,4vw,20px);
    font-weight:400;
    color:#5b3a49;
    margin-bottom:26px;
    line-height:1.7;
  }
  .game-btns{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    min-height:64px;
  }
  .game-btn{
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:14px 30px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.2,.9,.3,1.4), box-shadow .25s, opacity .5s;
    -webkit-tap-highlight-color:transparent;
  }
  .game-btn.yes{
    background:linear-gradient(135deg,#ff8fab,#d6336c);
    color:#fff;
    box-shadow:0 10px 24px rgba(214,51,108,.32);
    animation:heartbeat 1.7s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    22%{transform:scale(1.06);}
    38%{transform:scale(1);}
    56%{transform:scale(1.04);}
  }
  .game-btn.no{
    background:rgba(255,255,255,.92);
    color:#b98ba0;
    border:2px solid #ffd0e0;
    box-shadow:0 6px 16px rgba(214,51,108,.10);
  }
  .game-result{
    margin-top:24px;
    font-family:'Great Vibes',cursive;
    font-size:clamp(26px,6vw,40px);
    color:var(--deep);
    line-height:1.4;
    opacity:0;
    transform:scale(.8);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.9,.3,1.4);
  }
  .game-result.show{opacity:1;transform:scale(1);}
  .game-result .small{
    display:block;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:300;
    color:#8a6273;
    margin-top:10px;
    letter-spacing:.5px;
  }

  .rise{
    position:fixed;
    bottom:-40px;
    z-index:60;
    pointer-events:none;
    animation:rise 3.2s ease-out forwards;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.5) rotate(0deg);opacity:0;}
    15%{opacity:1;}
    100%{transform:translateY(-110vh) scale(1.2) rotate(40deg);opacity:0;}
  }

  @media(max-width:520px){
    .card{padding:30px 20px;border-radius:22px;}
    section{padding:55px 16px;}
    .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  }
</style>
</head>
<body class="locked">

<canvas id="petals"></canvas>

<div id="lockScreen">
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">🔒</div>
    <h1>A Little Surprise</h1>
    <p>Enter the secret password to open it 💗</p>
    <input type="password" id="pwInput" placeholder="• • • •" autocomplete="off" />
    <button id="pwBtn">Open 💗</button>
    <div id="errorMsg"></div>
  </div>
</div>

<main id="mainContent" class="hidden">

  <section class="hero">
    <div class="flower-wrap">
      <svg class="big-flower" viewBox="0 0 200 200" role="img" aria-label="White flower">
        <defs>
          <radialGradient id="petalGrad" cx="50%" cy="85%" r="85%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="65%" stop-color="#fffdfe"/>
            <stop offset="100%" stop-color="#ffeaf3"/>
          </radialGradient>
          <radialGradient id="coreGrad" cx="42%" cy="32%" r="72%">
            <stop offset="0%" stop-color="#fff6cf"/>
            <stop offset="55%" stop-color="#ffd97a"/>
            <stop offset="100%" stop-color="#eeb04a"/>
          </radialGradient>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g filter="url(#softGlow)">
          <g transform="rotate(0 100 100)"><path class="petal d1" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(45 100 100)"><path class="petal d2" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(90 100 100)"><path class="petal d3" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(135 100 100)"><path class="petal d4" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(180 100 100)"><path class="petal d5" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(225 100 100)"><path class="petal d6" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(270 100 100)"><path class="petal d7" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
          <g transform="rotate(315 100 100)"><path class="petal d8" d="M100,100 C78,72 78,32 100,14 C122,32 122,72 100,100 Z" fill="url(#petalGrad)"/></g>
        </g>

        <circle class="core" cx="100" cy="100" r="17" fill="url(#coreGrad)"/>
        <circle class="core" cx="100" cy="100" r="7" fill="#fff8d9" opacity=".9"/>
      </svg>
    </div>
    <h1 id="heroName">Happy Birthday</h1>
    <div class="sub" id="heroDate"></div>
    <div class="scroll-hint">scroll down ↓</div>
  </section>

  <section>
    <div class="wrap">
      <div class="card reveal">
        <h2 class="section-title">A Message For You</h2>
        <div id="messageText"></div>
        <div class="signature" id="signature"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="section-title reveal">Our Memories</h2>
      <div class="gallery-grid reveal" id="galleryGrid"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="section-title reveal">Little Moments</h2>
      <div class="video-grid reveal" id="videoGrid"></div>
    </div>
  </section>

  <section class="finale">
    <div class="wrap reveal">
      <div class="big">I love you, always 💗</div>
      <div class="hearts">🌸 💕 🌷 💕 🌸</div>
    </div>
  </section>

  <!-- Little game -->
  <section>
    <div class="wrap">
      <div class="card reveal game-card">
        <h2 class="section-title">One Little Question…</h2>
        <p class="game-q">Who is the prettiest girl in the whole world?</p>
        <div class="game-btns" id="gameBtns">
          <button class="game-btn yes" id="yesBtn">Me 💗</button>
          <button class="game-btn no" id="noBtn">Not me 🙈</button>
        </div>
        <div class="game-result" id="gameResult"></div>
      </div>
    </div>
  </section>

</main>

<button id="musicBtn" title="Music">🎵</button>
<audio id="bgMusic" loop src="song.mp3"></audio>

<div id="lightbox"><img id="lightboxImg" src="" alt="" /></div>

<script>
const PASSWORD = "1";
const HER_NAME = "My Love wedad";
const DATE_TEXT = "20 . 10";

const MESSAGE =
`Happy Birthday, my love.

I don't really know how to put into words how much you mean to me,
so I built this little place on the internet just for you instead.

Every day with you feels like a gift I didn't deserve.
Thank you for your laugh, your patience, and for being you.

I hope this year brings you everything you've been dreaming of —
and I hope I get to be there for all of it.
i hope all your dreams come true and become the most happiest person in the world i really mean it please always take care of yourself and never forget that you are worth all the good things 
I love you. 💗`;

const SIGNATURE = "ahmed";

const PHOTOS = [
  "photos/1.jpg",
  "photos/2.jpg",
  "photos/3.jpg",
  "photos/4.jpg",
  "photos/5.jpg",
  "photos/6.jpg",
  "photos/7.jpg",
  "photos/8.jpg",
  "photos/9.jpg",
  "photos/10.jpg",
  "photos/11.jpg",
];

const VIDEOS = [
  { src: "video.mp4" },
  { src: "video1.mp4" },
  { src: "video2.mp4", poster: "video2.jpg" },
];

// ---------- falling petals ----------
(function () {
  const canvas = document.getElementById('petals');
  const ctx = canvas.getContext('2d');
  let w, h, petals = [];
  const COLORS = ['#ffb6c1', '#ffc0cb', '#ff9eb5', '#ffd1dc', '#f8a5c2', '#ff8fab', '#ffdce8'];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function Petal() { this.reset(true); }
  Petal.prototype.reset = function (initial) {
    this.x = Math.random() * w;
    this.y = initial ? Math.random() * h : -30;
    this.size = 5 + Math.random() * 10;
    this.speed = 0.4 + Math.random() * 1.1;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.035;
    this.color = COLORS[(Math.random() * COLORS.length) | 0];
    this.phase = Math.random() * Math.PI * 2;
    this.alpha = 0.45 + Math.random() * 0.4;
  };
  Petal.prototype.update = function (t) {
    this.y += this.speed;
    this.x += Math.sin(t * 0.0009 + this.phase) * 0.9;
    this.angle += this.spin;
    if (this.y > h + 30) this.reset(false);
  };
  Petal.prototype.draw = function () {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.58, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  function init() {
    resize();
    const count = Math.min(70, Math.round((w * h) / 22000));
    petals = [];
    for (let i = 0; i < count; i++) petals.push(new Petal());
  }

  function loop(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of petals) { p.update(t); p.draw(); }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', init);
  init();
  requestAnimationFrame(loop);
})();

// ---------- fill content ----------
document.getElementById('heroName').textContent = 'Happy Birthday ' + HER_NAME;
document.getElementById('heroDate').textContent = DATE_TEXT;
document.getElementById('messageText').textContent = MESSAGE;
document.getElementById('signature').textContent = SIGNATURE;

// ---------- build gallery ----------
(function () {
  const grid = document.getElementById('galleryGrid');
  if (!PHOTOS.length) {
    grid.innerHTML = '<p style="opacity:.6;font-size:14px;text-align:center;grid-column:1/-1">No photos added yet 🌸</p>';
    return;
  }
  PHOTOS.forEach(function (src, i) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Memory ' + (i + 1);
    img.loading = 'lazy';
    img.addEventListener('click', function () { openLightbox(src); });
    img.addEventListener('error', function () {
      img.style.opacity = '.35';
      img.alt = 'Missing: ' + src;
    });
    grid.appendChild(img);
  });
})();

// ---------- build videos ----------
(function () {
  const grid = document.getElementById('videoGrid');
  if (!VIDEOS.length) {
    grid.innerHTML = '<p style="opacity:.6;font-size:14px;text-align:center;grid-column:1/-1">No videos added yet 🌷</p>';
    return;
  }
  VIDEOS.forEach(function (v) {
    const vid = document.createElement('video');
    vid.src = v.src;
    if (v.poster) vid.poster = v.poster;
    vid.controls = true;
    vid.preload = 'metadata';
    vid.playsInline = true;
    grid.appendChild(vid);
  });
})();

// ---------- lightbox ----------
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', function () {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { lightbox.classList.remove('open'); lightboxImg.src = ''; }
});

// ---------- password logic ----------
const lockScreen = document.getElementById('lockScreen');
const lockCard = document.getElementById('lockCard');
const pwInput = document.getElementById('pwInput');
const pwBtn = document.getElementById('pwBtn');
const errorMsg = document.getElementById('errorMsg');
const main = document.getElementById('mainContent');

function tryUnlock() {
  const value = pwInput.value.trim();
  if (value === PASSWORD) {
    errorMsg.textContent = '';
    lockScreen.classList.add('hide');
    document.body.classList.remove('locked');

    main.classList.remove('hidden');
    void main.offsetWidth;
    main.classList.add('show');

    heartBurst();
    bloomFlower();
    startMusic();

    setTimeout(function () { lockScreen.style.display = 'none'; }, 900);
    setTimeout(setupReveal, 400);
  } else {
    errorMsg.textContent = 'Wrong password, try again 💔';
    lockCard.classList.remove('shake');
    void lockCard.offsetWidth;
    lockCard.classList.add('shake');
    pwInput.value = '';
    pwInput.focus();
  }
}

pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') tryUnlock();
});

// ---------- heart burst ----------
function heartBurst() {
  const emojis = ['💖', '💕', '🌸', '✨', '💗', '🌷'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('span');
    el.className = 'burst';
    el.textContent = emojis[i % emojis.length];
    el.style.left = (50 + (Math.random() - 0.5) * 40) + '%';
    el.style.top = '50%';
    el.style.fontSize = (16 + Math.random() * 24) + 'px';
    el.style.setProperty('--dx', ((Math.random() - 0.5) * 620) + 'px');
    el.style.setProperty('--dy', (-Math.random() * 560 - 80) + 'px');
    el.style.animationDelay = (Math.random() * 0.35) + 's';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2800);
  }
}

// ---------- re-bloom the big white flower ----------
function bloomFlower() {
  document.querySelectorAll('.big-flower .petal, .big-flower .core').forEach(function (el) {
    el.style.animation = 'none';
    el.getBoundingClientRect();
    el.style.animation = '';
  });
}

// ---------- scroll reveal ----------
function setupReveal() {
  const els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('visible'); });
    return;
  }
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(function (el) { io.observe(el); });
}

// ---------- music ----------
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let musicAvailable = false;

bgMusic.addEventListener('canplaythrough', function () {
  musicAvailable = true;
  musicBtn.classList.add('show');
}, { once: true });
bgMusic.addEventListener('error', function () {
  musicAvailable = false;
  musicBtn.classList.remove('show');
});

function startMusic() {
  if (!musicAvailable) return;
  bgMusic.volume = 0.35;
  bgMusic.play().then(function () {
    musicBtn.textContent = '🔊';
  }).catch(function () {
    musicBtn.textContent = '🔇';
  });
}

musicBtn.addEventListener('click', function () {
  if (bgMusic.paused) {
    bgMusic.play();
    musicBtn.textContent = '🔊';
  } else {
    bgMusic.pause();
    musicBtn.textContent = '🔇';
  }
});

// ---------- little game ----------
(function () {
  const yesBtn = document.getElementById('yesBtn');
  const noBtn  = document.getElementById('noBtn');
  const result = document.getElementById('gameResult');
  let dodges = 0;
  let won = false;

  const NO_TEXTS = [
    'Are you sure? 🤨',
    'Try again 😅',
    'Nope 😌',
    'You can\'t catch me!',
    'Just press Me 💗'
  ];

  function dodge(e) {
    if (won) return;
    if (e && e.cancelable) e.preventDefault();
    dodges++;

    const x = (Math.random() - 0.5) * 200;
    const y = (Math.random() - 0.5) * 90;
    noBtn.style.transform =
      'translate(' + x + 'px,' + y + 'px) rotate(' + ((Math.random() - 0.5) * 24) + 'deg)';

    const idx = Math.floor(dodges / 2);
    if (dodges % 2 === 0 && idx < NO_TEXTS.length) noBtn.textContent = NO_TEXTS[idx];
    if (dodges > 6) noBtn.style.opacity = '.35';
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });

  yesBtn.addEventListener('click', function () {
    if (won) return;
    won = true;

    noBtn.style.opacity = '0';
    noBtn.style.pointerEvents = 'none';
    noBtn.style.transform = 'scale(.5)';
    yesBtn.style.animation = 'none';

    result.innerHTML =
      'Correct! It\'s you, always 💗' +
      '<span class="small">The prettiest girl in every room, every day.</span>';
    result.classList.add('show');

    heartBurst();
    heartRain();
  });

  function heartRain() {
    const emojis = ['💗', '💕', '🌸', '💖', '🌷', '✨', '💞', '🌺'];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('span');
      el.className = 'rise';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.fontSize = (14 + Math.random() * 26) + 'px';
      el.style.animationDelay = (Math.random() * 1.2) + 's';
      el.style.animationDuration = (2.6 + Math.random() * 1.6) + 's';
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 5200);
    }
  }
})();

// ---------- start ----------
pwInput.focus();
</script>
